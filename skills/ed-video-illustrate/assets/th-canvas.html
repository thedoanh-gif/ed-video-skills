<!doctype html>
<!-- ED_Video Kit · khối cảnh "th-canvas": cả khung 1920x1080 là một CẢNH MINH HỌA tự do (không còn khuôn chữ trái / hình phải).
     Mỗi cảnh = danh sách phần tử (người, bong bóng thoại, cửa sổ giao diện, thẻ, chat, đồng hồ, bút khoanh/gạch, con trỏ...) có giờ vào theo lời đọc. -->
<html lang="vi" data-composition-variables='[
  {"id":"spec","type":"string","label":"JSON mô tả cảnh: {bg,acc,crumb,els:[...]}","default":"{}"},
  {"id":"dur","type":"string","label":"Thời lượng cảnh (giây)","default":"0"}
]'>
<body>
<div data-composition-id="th-canvas" data-width="1920" data-height="1080" data-start="0" data-duration="60">
  <style>
    [data-composition-id="th-canvas"]{font-family:var(--font-display,'DINRoundOT',sans-serif);color:#27364A}
    [data-composition-id="th-canvas"] .wrap{position:absolute;inset:0;overflow:hidden}
    [data-composition-id="th-canvas"] .wrap.navy{background:linear-gradient(135deg,#1B3B6B 0%,#234C87 55%,#2F5D9F 100%);color:#fff}
    [data-composition-id="th-canvas"] .wrap.light{background:linear-gradient(135deg,#F4F8FD 0%,#EAF2FC 55%,#FBF6EC 100%)}
    [data-composition-id="th-canvas"] .wrap.cream{background:linear-gradient(135deg,#FBF6EC 0%,#F7F0E2 60%,#F2E6CC 100%)}
    [data-composition-id="th-canvas"] .wrap.ink{background:linear-gradient(135deg,#1c2a3e 0%,#27364A 100%);color:#fff}
    [data-composition-id="th-canvas"] .deco{position:absolute;left:0;top:0;width:1920px;height:1080px}
    [data-composition-id="th-canvas"] .cam{position:absolute;left:0;top:0;width:1920px;height:1080px}
    [data-composition-id="th-canvas"] .el{position:absolute;box-sizing:border-box}
    [data-composition-id="th-canvas"] .paper{background:#fff;border:3px solid #27364A;border-radius:14px;box-shadow:6px 6px 0 #27364A;color:#27364A}
    [data-composition-id="th-canvas"] .w{display:inline-block;overflow:hidden;vertical-align:top;padding:.14em .04em .12em;margin:-.14em -.04em -.12em}
    [data-composition-id="th-canvas"] .wi{display:inline-block}
    [data-composition-id="th-canvas"] .hl{background:linear-gradient(currentColor,currentColor) 0 100%/0% 8px no-repeat;padding-bottom:4px}
    [data-composition-id="th-canvas"] .crumb{font-family:'Courier New',monospace;font-size:28px;letter-spacing:.06em;opacity:.7}
    [data-composition-id="th-canvas"] .tag{display:inline-block;padding:8px 22px;border-radius:8px;font-weight:700;letter-spacing:.12em;font-size:30px;color:#fff;box-shadow:4px 4px 0 rgba(0,0,0,.2);white-space:nowrap}
    [data-composition-id="th-canvas"] .badgeN{display:inline-flex;align-items:center;justify-content:center;width:84px;height:84px;border-radius:20px;color:#fff;font-weight:700;font-size:54px;box-shadow:4px 4px 0 rgba(0,0,0,.2)}
    [data-composition-id="th-canvas"] .bub{position:relative;border:3px solid #27364A;border-radius:28px;padding:18px 28px;font-weight:500;line-height:1.25;color:#27364A;box-shadow:5px 5px 0 rgba(39,54,74,.9)}
    [data-composition-id="th-canvas"] .bub::after{content:"";position:absolute;width:30px;height:30px;background:inherit;border:3px solid #27364A;border-top:none;border-left:none;bottom:-17px;transform:rotate(45deg)}
    [data-composition-id="th-canvas"] .bub.fl::after{left:46px}
    [data-composition-id="th-canvas"] .bub.fr::after{right:46px;transform:rotate(45deg)}
    [data-composition-id="th-canvas"] .bub.nt::after{display:none}
    [data-composition-id="th-canvas"] .think{position:relative;border:3px solid #27364A;border-radius:60px;padding:22px 34px;font-weight:500;line-height:1.25;background:#fff;color:#27364A;box-shadow:5px 5px 0 rgba(39,54,74,.9)}
    [data-composition-id="th-canvas"] .cur{display:inline-block;width:3px;height:1em;background:currentColor;vertical-align:-0.12em;margin-left:2px}
    [data-composition-id="th-canvas"] .winbar{height:58px;border-bottom:3px solid #27364A;border-radius:11px 11px 0 0;background:#EAF2FC;display:flex;align-items:center;gap:10px;padding:0 18px;font-family:'Courier New',monospace;font-size:28px;color:#2F5D9F}
    [data-composition-id="th-canvas"] .winbar i{width:14px;height:14px;border-radius:50%;background:#BE4F74;display:block}
    [data-composition-id="th-canvas"] .winbar i:nth-child(2){background:#D9B65E}
    [data-composition-id="th-canvas"] .winbar i:nth-child(3){background:#2F8F6B}
    [data-composition-id="th-canvas"] .wp{position:absolute;left:0;top:0;width:1920px;height:1080px;z-index:50;pointer-events:none}
    [data-composition-id="th-canvas"] .wp.a{background:linear-gradient(135deg,#B88A2D,#D9B65E)}
    [data-composition-id="th-canvas"] .wp.b{background:linear-gradient(135deg,#1B3B6B,#234C87)}
  </style>
  <div class="wrap" id="wrap" data-layout-allow-overflow>
    <svg class="deco" data-layout-ignore viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="cam" id="cam" data-layout-allow-overflow></div>
    <div class="wp a" data-layout-ignore></div>
    <div class="wp b" data-layout-ignore></div>
  </div>
  <script>

      eye:function(){return P('M-70 0 Q0 -58 70 0 Q0 58 -70 0 Z',C.white)+CI(0,0,24,C.sky)+CN(0,0,10,C.ink)+CN(8,-8,4,C.white)},

      check:function(){return CI(0,0,56,C.mintS)+'<path class="chk" pathLength="1" stroke-dasharray="1" d="M-24 2 L-6 22 L26 -20" fill="none" stroke="'+C.mint+'" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>'},

    // ---------- dựng phần tử
    var uid=0;
    function mk(e,parent){var d=document.createElement('div');d.className='el k-'+e.k;d.style.left=(e.x||0)+'px';d.style.top=(e.y||0)+'px';if(e.w)d.style.width=e.w+'px';if(e.h)d.style.height=e.h+'px';if(e.z)d.style.zIndex=e.z;parent.appendChild(d);return d}
    function words(txt,hi){txt=String(txt||'');var hs=hi?txt.indexOf(hi):-1,he=hs>=0?hs+hi.length:-1,pos=0,out='',inH=false;

        if(h&&!inH){out+='<span class="hl" style="color:'+(e_hl||ACC)+'">';inH=true}
        if(!h&&inH){out+='</span>';inH=false}
        out+=(i?' ':'')+'<span class="w" data-layout-allow-overflow><span class="wi">'+esc(w)+'</span></span>'});
      if(inH)out+='</span>';return out}
    var e_hl=null;
    function enter(d,e,t){var a=e.a||'pop',o=e.o||'50% 50%';
      var from={opacity:0,transformOrigin:o},to={opacity:1,x:0,y:0,scale:1,rotation:0,duration:.55,ease:'back.out(1.8)'};
      if(a==='pop'){from.scale=.35;from.y=24;to.ease='back.out(2.2)'}
      else if(a==='up'){from.y=60;to.ease='power3.out'}
      else if(a==='down'){from.y=-60;to.ease='bounce.out';to.duration=.8}
      else if(a==='left'){from.x=-160;to.ease='back.out(1.5)'}
      else if(a==='right'){from.x=160;to.ease='back.out(1.5)'}
      else if(a==='fade'){to.ease='power1.out';to.duration=.5}
      else if(a==='zoom'){from.scale=1.4;to.ease='power3.out'}

    function leave(d,e){if(e.out!=null)tl.to(d,{opacity:0,scale:.85,duration:.3,ease:'power2.in'},e.out)}
    function typed(el,txt,t,dur,caret){var o={n:0},len=txt.length;tl.to(o,{n:len,duration:dur,ease:'none',onUpdate:function(){var k=Math.round(o.n);el.innerHTML=esc(txt.slice(0,k))+(caret&&k<len?'<span class="cur"></span>':'')}},t)}
    function idleBob(d,t,amp,per){tl.fromTo(d,{y:0},{y:-(amp||5),duration:per||1.6,ease:'sine.inOut',yoyo:true,repeat:Math.ceil((END-t)/(per||1.6))},t+.7)}

    var K={};
    K.text=function(d,e){var sz=e.size||64;d.style.fontSize=sz+'px';d.style.fontWeight=e.wt||700;d.style.lineHeight=e.lh||1.18;d.style.color=e.c?col(e.c):'';if(e.al)d.style.textAlign=e.al;if(e.mono)d.style.fontFamily="'Courier New',monospace";
      var t=e.t||0.3;

      var wi=qa(d,'.wi');tl.fromTo(wi,{yPercent:115,rotation:5,opacity:0,transformOrigin:'0% 100%'},{yPercent:0,rotation:0,opacity:1,duration:.5,ease:'back.out(1.7)',stagger:e.st||.07},t);
      var h=qa(d,'.hl')[0];if(h){var ht=e.hlt!=null?e.hlt:t+.6;tl.fromTo(h,{backgroundSize:'0% 8px'},{backgroundSize:'100% 8px',duration:.5,ease:'power2.out'},ht);tl.to(qa(h,'.w'),{y:-8,duration:.18,yoyo:true,repeat:1,stagger:.05,ease:'power2.out'},ht)}
      return {skip:true}};
    K.badge=function(d,e){d.style.display='flex';d.style.alignItems='center';d.style.gap='22px';
      d.innerHTML='<span class="badgeN" style="background:'+col(e.c||SPEC.acc||'gold')+'">'+esc(e.n)+'</span><span style="font-size:'+(e.size||76)+'px;font-weight:700;line-height:1.05">'+esc(e.text)+(e.sub?'<br><span style="font-size:32px;font-weight:500;opacity:.75">'+esc(e.sub)+'</span>':'')+'</span>'};
