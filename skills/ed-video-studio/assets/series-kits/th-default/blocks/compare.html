<!doctype html>
<!-- ED_Video Kit · khung cảnh "compare". Đổi nội dung bằng data-variable-values ở thẻ gắn (xem README.md cùng thư mục). -->
<html lang="vi" data-composition-variables='[
  {"id":"heading","type":"string","label":"Tiêu đề. Để trống thì ẩn","default":"Cách cũ và cách mới"},
  {"id":"left_title","type":"string","label":"Tên cột trái (cách chưa tốt)","default":"Trước đây"},
  {"id":"left_items","type":"string","label":"Ý cột trái, ngăn cách bằng | (tối đa 4)","default":"Ý chưa tốt 1|Ý chưa tốt 2|Ý chưa tốt 3"},
  {"id":"right_title","type":"string","label":"Tên cột phải (cách tốt)","default":"Từ nay"},
  {"id":"right_items","type":"string","label":"Ý cột phải, ngăn cách bằng | (tối đa 4)","default":"Ý tốt 1|Ý tốt 2|Ý tốt 3"},
  {"id":"times","type":"string","label":"Giây: tiêu đề|cột trái|cột phải (các ý trong cột hiện cách nhau 0,4 giây)","default":"0.2|0.8|3.0"}
]'>
<body>
<div data-composition-id="compare" data-width="1920" data-height="1080" data-start="0" data-duration="600">
  <style>
    [data-composition-id="compare"]{font-family:var(--font-display,'DINRoundOT',sans-serif);color:var(--ink,#27364A)}
    [data-composition-id="compare"] .wrap{position:absolute;inset:0;background:var(--bg,#F7F9FC);overflow:hidden}
    [data-composition-id="compare"] .deco{position:absolute;right:-220px;top:-220px;width:760px;height:760px;border-radius:50%;background:var(--bg-alt,#EAF2FC)}
    [data-composition-id="compare"] .head{position:absolute;left:200px;top:120px;right:200px;font-size:64px;font-weight:700;line-height:1.15}
    [data-composition-id="compare"] .head:before{content:"";display:block;width:72px;height:8px;border-radius:4px;background:var(--accent,#B88A2D);margin-bottom:28px}
    [data-composition-id="compare"] .cols{position:absolute;left:200px;right:200px;top:360px;display:flex;gap:56px;align-items:stretch}
    [data-composition-id="compare"] .col{flex:1;background:var(--card,#fff);border:var(--card-border,0 solid transparent);border-radius:var(--radius-card,28px);box-shadow:var(--card-shadow,0 18px 50px rgba(35,76,135,.10));padding:52px 56px}
    [data-composition-id="compare"] .col.bad{background:#F3F4F6;box-shadow:none;border-color:#D1D5DB}
    [data-composition-id="compare"] .ct{font-size:48px;font-weight:700;margin-bottom:36px;display:flex;align-items:center;gap:20px}
    [data-composition-id="compare"] .bad .ct{color:var(--ink-2,#6B7280)} [data-composition-id="compare"] .good .ct{color:var(--primary,#2F5D9F)}
    [data-composition-id="compare"] .mk{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:40px;color:#fff;flex:none}
    [data-composition-id="compare"] .bad .mk{background:#9CA3AF} [data-composition-id="compare"] .good .mk{background:var(--primary,#2F5D9F)}
    [data-composition-id="compare"] .it{font-size:42px;line-height:1.25;padding:18px 0 18px 36px;position:relative}
    [data-composition-id="compare"] .it:before{content:"";position:absolute;left:0;top:38px;width:14px;height:14px;border-radius:50%}
    [data-composition-id="compare"] .bad .it{color:var(--ink-2,#6B7280)} [data-composition-id="compare"] .bad .it:before{background:#9CA3AF}
    [data-composition-id="compare"] .good .it:before{background:var(--accent,#B88A2D)}
  </style>
  <div class="wrap"><div class="deco" data-layout-ignore></div><div class="head"></div>
    <div class="cols"><div class="col bad"><div class="ct"><span class="mk">✕</span><span class="lt"></span></div><div class="li"></div></div>
    <div class="col good"><div class="ct"><span class="mk">✓</span><span class="rt"></span></div><div class="ri"></div></div></div></div>
  <script>
  (function(){
    var S='[data-composition-id="compare"]';
    var root=document.querySelector(S);
    var q=function(s){return root.querySelector(s)};
    var qa=function(s){return Array.prototype.slice.call(root.querySelectorAll(s))};
    var v=window.__hyperframes.getVariables();
    function T(v,n,d){var a=String(v.times||"").split("|").map(function(x){return parseFloat(x)});var o=[];for(var i=0;i<n;i++){o.push(isFinite(a[i])?a[i]:d[i])}return o}
    function L(s){return String(s||"").split("|").map(function(x){return x.trim()}).filter(Boolean)}
    function fit(el,maxH,minPx){if(!el)return;var px=parseFloat(getComputedStyle(el).fontSize);var g=0;while(el.scrollHeight>maxH&&px>minPx&&g<40){px-=4;el.style.fontSize=px+"px";g++}}
    var tl=gsap.timeline({paused:true});
    var t=T(v,3,[0.2,0.8,3.0]);
    q('.head').textContent=v.heading||''; if(!v.heading){q('.head').style.display='none';q('.cols').style.top='160px'}
    q('.lt').textContent=v.left_title||''; q('.rt').textContent=v.right_title||'';
    function fill(box,arr){arr.slice(0,4).forEach(function(s){var d=document.createElement('div');d.className='it';d.textContent=s;box.appendChild(d)})}
    fill(q('.li'),L(v.left_items)); fill(q('.ri'),L(v.right_items));
    tl.from(q('.deco'),{scale:.85,opacity:0,duration:.9,ease:'power2.out'},0);
    if(v.heading)tl.from(q('.head'),{opacity:0,y:30,duration:.55,ease:'power3.out'},t[0]);
    tl.from(q('.bad'),{opacity:0,x:-40,duration:.55,ease:'power3.out'},t[1]);
    tl.from(qa('.bad .it'),{opacity:0,y:16,duration:.4,stagger:.4,ease:'power2.out'},t[1]+.3);
    tl.from(q('.good'),{opacity:0,x:40,duration:.55,ease:'power3.out'},t[2]);
    tl.from(qa('.good .it'),{opacity:0,y:16,duration:.4,stagger:.4,ease:'power2.out'},t[2]+.3);
    tl.to(q('.deco'),{x:-60,y:40,scale:1.06,duration:12,ease:'none'},0.9);
    window.__timelines=window.__timelines||{};
    window.__timelines["compare"]=tl;
  })();
  </script>
</div>
</body>
</html>
