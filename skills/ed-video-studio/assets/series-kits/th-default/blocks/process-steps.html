<!doctype html>
<!-- ED_Video Kit · khung cảnh "process-steps". Đổi nội dung bằng data-variable-values ở thẻ gắn (xem README.md cùng thư mục). -->
<html lang="vi" data-composition-variables='[
  {"id":"heading","type":"string","label":"Tiêu đề, tối đa 8 từ","default":"Quy trình 4 bước"},
  {"id":"steps","type":"string","label":"3–5 bước, ngăn cách bằng | (mỗi bước tối đa 5 từ)","default":"Đăng ký|Học trực tuyến|Làm bài kiểm tra|Nhận chứng nhận"},
  {"id":"times","type":"string","label":"Giây: tiêu đề|bước 1|bước 2|...","default":"0.2|1.0|2.4|3.8|5.2|6.6"}
]'>
<body>
<div data-composition-id="process-steps" data-width="1920" data-height="1080" data-start="0" data-duration="600">
  <style>
    [data-composition-id="process-steps"]{font-family:var(--font-display,'DINRoundOT',sans-serif);color:var(--ink,#27364A)}
    [data-composition-id="process-steps"] .wrap{position:absolute;inset:0;background:var(--bg,#F7F9FC);overflow:hidden}
    [data-composition-id="process-steps"] .deco{position:absolute;right:-220px;top:-220px;width:760px;height:760px;border-radius:50%;background:var(--bg-alt,#EAF2FC)}
    [data-composition-id="process-steps"] .head{position:absolute;left:200px;top:120px;right:200px;font-size:64px;font-weight:700;line-height:1.15}
    [data-composition-id="process-steps"] .head:before{content:"";display:block;width:72px;height:8px;border-radius:4px;background:var(--accent,#B88A2D);margin-bottom:28px}
    [data-composition-id="process-steps"] .track{position:absolute;left:200px;right:200px;top:470px;height:420px}
    [data-composition-id="process-steps"] .line{position:absolute;left:0;right:0;top:58px;height:8px;border-radius:4px;background:#DCE5F2}
    [data-composition-id="process-steps"] .fill{position:absolute;left:0;top:58px;height:8px;border-radius:4px;background:var(--primary,#2F5D9F);width:0}
    [data-composition-id="process-steps"] .step{position:absolute;top:0;width:320px;margin-left:-160px;text-align:center}
    [data-composition-id="process-steps"] .dot{width:124px;height:124px;border-radius:50%;margin:0 auto;background:var(--card,#fff);border:8px solid var(--primary,#2F5D9F);display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:700;color:var(--primary,#2F5D9F)}
    [data-composition-id="process-steps"] .step.on .dot{background:var(--primary,#2F5D9F);color:#fff}
    [data-composition-id="process-steps"] .lab{font-size:42px;font-weight:500;line-height:1.2;margin-top:32px}
  </style>
  <div class="wrap"><div class="deco" data-layout-ignore></div><div class="head"></div>
    <div class="track"><div class="line"></div><div class="fill"></div></div></div>
  <script>
  (function(){
    var S='[data-composition-id="process-steps"]';
    var root=document.querySelector(S);
    var q=function(s){return root.querySelector(s)};
    var qa=function(s){return Array.prototype.slice.call(root.querySelectorAll(s))};
    var v=window.__hyperframes.getVariables();
    function T(v,n,d){var a=String(v.times||"").split("|").map(function(x){return parseFloat(x)});var o=[];for(var i=0;i<n;i++){o.push(isFinite(a[i])?a[i]:d[i])}return o}
    function L(s){return String(s||"").split("|").map(function(x){return x.trim()}).filter(Boolean)}
    function fit(el,maxH,minPx){if(!el)return;var px=parseFloat(getComputedStyle(el).fontSize);var g=0;while(el.scrollHeight>maxH&&px>minPx&&g<40){px-=4;el.style.fontSize=px+"px";g++}}
    var tl=gsap.timeline({paused:true});
    var st=L(v.steps).slice(0,5); var n=st.length; var t=T(v,1+n,[0.2,1.0,2.4,3.8,5.2,6.6]);
    q('.head').textContent=v.heading||'';
    var tr=q('.track'); var W=1520;
    var pos=function(i){return n>1? 160+(W-320)*i/(n-1) : W/2};
    q('.line').style.left=pos(0)+'px'; q('.line').style.right=(W-pos(n-1))+'px'; q('.fill').style.left=pos(0)+'px';
    st.forEach(function(s,i){var d=document.createElement('div');d.className='step';d.style.left=pos(i)+'px';d.innerHTML='<div class="dot">'+(i+1)+'</div><div class="lab"></div>';d.querySelector('.lab').textContent=s;tr.appendChild(d)});
    qa('.lab').forEach(function(e){fit(e,150,28)});
    tl.from(q('.deco'),{scale:.85,opacity:0,duration:.9,ease:'power2.out'},0);
    tl.from(q('.head'),{opacity:0,y:30,duration:.55,ease:'power3.out'},t[0]);
    tl.from(q('.line'),{scaleX:0,transformOrigin:'left center',duration:.6,ease:'power2.out'},t[0]+.2);
    qa('.step').forEach(function(s,i){
      if(i>0)tl.to(q('.fill'),{width:(pos(i)-pos(0))+'px',duration:.5,ease:'power2.inOut'},t[i+1]-.3);
      tl.from(s,{opacity:0,y:40,duration:.5,ease:'back.out(1.6)'},t[i+1]);
      tl.set(s,{className:'step on'},t[i+1]+.2);
    });
    tl.to(q('.deco'),{x:-60,y:40,scale:1.06,duration:12,ease:'none'},0.9);
    window.__timelines=window.__timelines||{};
    window.__timelines["process-steps"]=tl;
  })();
  </script>
</div>
</body>
</html>
