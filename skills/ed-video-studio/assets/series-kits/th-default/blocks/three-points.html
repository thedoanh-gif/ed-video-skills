<!doctype html>
<!-- ED_Video Kit · khung cảnh "three-points". Đổi nội dung bằng data-variable-values ở thẻ gắn (xem README.md cùng thư mục). -->
<html lang="vi" data-composition-variables='[
  {"id":"heading","type":"string","label":"Tiêu đề, tối đa 8 từ","default":"Ba điều cần nhớ"},
  {"id":"items","type":"string","label":"2–4 ý, ngăn cách bằng | (mỗi ý tối đa 6 từ)","default":"Ý thứ nhất|Ý thứ hai|Ý thứ ba"},
  {"id":"times","type":"string","label":"Giây: tiêu đề|ý 1|ý 2|ý 3|ý 4 (đặt theo lúc giọng đọc tới ý đó)","default":"0.2|1.0|2.6|4.2|5.8"},
  {"id":"focus","type":"string","label":"yes = ý cũ mờ đi khi ý mới hiện (một điểm nhìn)","default":"yes"}
]'>
<body>
<div data-composition-id="three-points" data-width="1920" data-height="1080" data-start="0" data-duration="600">
  <style>
    [data-composition-id="three-points"]{font-family:var(--font-display,'DINRoundOT',sans-serif);color:var(--ink,#27364A)}
    [data-composition-id="three-points"] .wrap{position:absolute;inset:0;background:var(--bg,#F7F9FC);overflow:hidden}
    [data-composition-id="three-points"] .deco{position:absolute;right:-220px;top:-220px;width:760px;height:760px;border-radius:50%;background:var(--bg-alt,#EAF2FC)}
    [data-composition-id="three-points"] .head{position:absolute;left:200px;top:120px;right:200px;font-size:64px;font-weight:700;line-height:1.15}
    [data-composition-id="three-points"] .head:before{content:"";display:block;width:72px;height:8px;border-radius:4px;background:var(--accent,#B88A2D);margin-bottom:28px}
    [data-composition-id="three-points"] .row{position:absolute;left:200px;right:200px;top:400px;display:flex;gap:48px}
    [data-composition-id="three-points"] .card{flex:1;background:var(--card,#fff);border:var(--card-border,0 solid transparent);border-radius:var(--radius-card,28px);box-shadow:var(--card-shadow,0 18px 50px rgba(35,76,135,.10));padding:56px 48px;min-height:420px}
    [data-composition-id="three-points"] .idx{font-size:72px;font-weight:700;color:var(--accent-text,#9D6F1D);line-height:1;margin-bottom:36px}
    [data-composition-id="three-points"] .txt{font-size:52px;font-weight:500;line-height:1.2}
  </style>
  <div class="wrap"><div class="deco" data-layout-ignore></div><div class="head"></div><div class="row"></div></div>
  <script>
  (function(){
    var S='[data-composition-id="three-points"]';
    var root=document.querySelector(S);
    var q=function(s){return root.querySelector(s)};
    var qa=function(s){return Array.prototype.slice.call(root.querySelectorAll(s))};
    var v=window.__hyperframes.getVariables();
    function T(v,n,d){var a=String(v.times||"").split("|").map(function(x){return parseFloat(x)});var o=[];for(var i=0;i<n;i++){o.push(isFinite(a[i])?a[i]:d[i])}return o}
    function L(s){return String(s||"").split("|").map(function(x){return x.trim()}).filter(Boolean)}
    function fit(el,maxH,minPx){if(!el)return;var px=parseFloat(getComputedStyle(el).fontSize);var g=0;while(el.scrollHeight>maxH&&px>minPx&&g<40){px-=4;el.style.fontSize=px+"px";g++}}
    var tl=gsap.timeline({paused:true});
    var items=L(v.items).slice(0,4); var t=T(v,1+items.length,[0.2,1.0,2.6,4.2,5.8]);
    q('.head').textContent=v.heading||'';
    var row=q('.row');
    items.forEach(function(s,i){var c=document.createElement('div');c.className='card';c.innerHTML='<div class="idx">0'+(i+1)+'</div><div class="txt"></div>';c.querySelector('.txt').textContent=s;row.appendChild(c)});
    qa('.txt').forEach(function(e){fit(e,240,34)});
    tl.from(q('.deco'),{scale:.85,opacity:0,duration:.9,ease:'power2.out'},0);
    tl.from(q('.head'),{opacity:0,y:30,duration:.55,ease:'power3.out'},t[0]);
    qa('.card').forEach(function(c,i){
      tl.from(c,{opacity:0,y:60,duration:.6,ease:'power3.out'},t[i+1]);
      if(v.focus!=='no'&&i>0)tl.to(qa('.card').slice(0,i),{opacity:.45,duration:.4,ease:'power1.out'},t[i+1]);
    });
    if(v.focus!=='no'&&items.length>1)tl.to(qa('.card'),{opacity:1,duration:.4},t[items.length]+1.6);
    tl.to(q('.deco'),{x:-60,y:40,scale:1.06,duration:12,ease:'none'},0.9);
    window.__timelines=window.__timelines||{};
    window.__timelines["three-points"]=tl;
  })();
  </script>
</div>
</body>
</html>
